<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Little Love From Everyone</title>
  <meta name="theme-color" content="#f8c7d8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/shell.css">
  <link rel="stylesheet" href="assets/birthday-wishes.css">
</head>
<body class="app" data-page="wishes">
  <div class="stage">
    <header class="nav" id="nav"></header>
    <nav class="side ab" id="side" aria-label="Pages" style="--x:24;--y:183;--w:262;--h:779"></nav>

    <main class="content wishes-layout">
      <div class="wishes-head ab" style="--x:301;--y:222;--w:1000;--h:100">
        <h1 class="page-title">A Little Love From Everyone</h1>
        <p class="wishes-sub">Different voices, different messages, all for one very special girl.</p>
      </div>

      <!-- the cards are created by assets/birthday-wishes.js from assets/wishes-data.js;
           click a card to read the whole message -->
      <div class="wishes-scroll ab" style="--x:293;--y:345;--w:1108;--h:617">
        <div class="wishes" id="wishes"></div>
      </div>
    </main>
  </div>

  <script src="assets/shell.js"></script>
  <script src="assets/wishes-data.js" charset="utf-8"></script>
  <script src="assets/birthday-wishes.js"></script>
</body>
</html>
