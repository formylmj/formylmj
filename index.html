<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Surprise for My Favorite Girl</title>
  <meta name="theme-color" content="#ffe4e9">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/countdown.css">
</head>
<body>
  <main class="page">
    <p class="eyebrow">A Surprise for My</p>
    <h1 class="title">Favorite Girl</h1>

    <p class="message">
      Something special is waiting for you...<br>
      but you’ll have to wait until your birthday. &lt;3
    </p>

    <div class="countdown" role="timer" aria-label="Time left until your birthday">
      <div class="unit"><div class="box" id="cdDays">00</div><div class="label">Days</div></div>
      <div class="sep" aria-hidden="true"><i></i><i></i></div>
      <div class="unit"><div class="box" id="cdHours">00</div><div class="label">Hours</div></div>
      <div class="sep" aria-hidden="true"><i></i><i></i></div>
      <div class="unit"><div class="box" id="cdMinutes">00</div><div class="label">Minutes</div></div>
      <div class="sep" aria-hidden="true"><i></i><i></i></div>
      <div class="unit"><div class="box" id="cdSeconds">00</div><div class="label">Seconds</div></div>
    </div>

    <!-- Locked until 13 Oct 2026 12:00 AM (PH time). countdown.js adds the link when it is time. -->
    <a class="gift" id="giftBtn" aria-disabled="true" tabindex="-1">
      <svg class="ic-lock" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5a5 5 0 0 0-5 5V9H6a2 2 0 0 0-2 2v9.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2h-1V6.500a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0V9H9z"/></svg>
      <svg class="ic-open" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5a5 5 0 0 0-5 5V9H6a2 2 0 0 0-2 2v9.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2H9V6.500a3 3 0 0 1 5.800-1.100l1.900-.7A5 5 0 0 0 12 1.500z"/></svg>
      <span id="giftLabel">Open my birthday gift</span>
    </a>

    <p class="note" id="giftNote">Come back when the countdown reaches zero!</p>

    <div class="divider" aria-hidden="true">
      <span></span>
      <svg viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width=".9" stroke-linejoin="round" d="M8 1.9C11.5-1.4 18 3.600 8 14.500-2 3.600 4.500-1.400 8 1.900z"/></svg>
      <span></span>
    </div>
  </main>

  <script src="assets/countdown.js"></script>
</body>
</html>
